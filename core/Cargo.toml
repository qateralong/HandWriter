[package]
name = "handwriter-core"
description = "HandWriter core: handwriting and drawings to pencil gcode"
version.workspace = true
edition.workspace = true

[dependencies]
blake2 = "0.10"
encoding_rs = "0.8.42"
indexmap = { version = "2", features = ["serde"] }
mozjpeg = "0.10.13"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
mupdf-sys = { version = "0.8", default-features = false, features = ["sys-lib-libjpeg"] }
png = "0.18.1"
rayon = "1.12.0"
regex = "1.13.1"
roxmltree = "0.21.1"
rustybuzz = "0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
unicode-general-category = "1.1.0"
unicode_names2 = "4"
unicode-normalization = "0.1.25"
