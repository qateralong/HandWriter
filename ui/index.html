<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HandWriter</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><img src="/static/icon.png" alt=""><span>HandWriter</span></div>
    <div class="seg" id="modeSeg" role="tablist" aria-label="Режим">
      <button data-mode="drawing" class="on" role="tab">Чертёж</button>
      <button data-mode="notebook" role="tab">Тетрадный</button>
    </div>
  </div>
  <div class="center-tools">
    <div class="seg" id="viewSeg" aria-label="Вид">
      <button data-view="one" class="on">Один лист</button>
      <button data-view="all">Все листы</button>
    </div>
    <div class="pager" id="pager" hidden>
      <button id="prevPass" class="icon" title="Предыдущий проход" aria-label="Предыдущий проход">‹</button>
      <span id="passLabel"></span>
      <button id="nextPass" class="icon" title="Следующий проход" aria-label="Следующий проход">›</button>
    </div>
  </div>
  <div class="actions">
    <button id="printerBtn" class="icon round" title="Принтер по кабелю — появится позже" aria-label="Принтер" disabled>
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
      <i class="dot"></i>
    </button>
    <button id="settingsBtn" class="icon round" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="messages" id="messages"></div>
  <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busyText">считаю…</span></div>
  <div class="placeholder" id="notebookStub" hidden>
    <h2>Тетрадный режим</h2>
    <p>Новый вид тетрадного режима появится на следующих шагах.<br>Пока им можно пользоваться в <a href="/classic">классическом интерфейсе</a>.</p>
  </div>
</main>

<footer class="bottom">
  <div class="left">
    <label class="btn primary" id="uploadBtn">
      <input type="file" id="fileInput" accept=".svg,.dxf,.pdf,.png,.jpg,.jpeg" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <span>Загрузить файл</span>
    </label>
    <button class="btn" id="paramsBtn" title="Параметры чертежа" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Чертёж</span>
      <span class="caret">▴</span>
    </button>
    <span class="file" id="fileName"></span>
  </div>
  <div class="time" id="timeBox">Время печати: <b id="timeVal">—</b></div>
  <div class="right">
    <button class="btn primary" id="downloadBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>
      <span>Скачать gcode</span>
    </button>
  </div>
</footer>
<div class="popover quick" id="paramsPop" hidden>
  <div class="pop-head"><span class="pop-title">Параметры чертежа</span><button class="icon" id="paramsClose" aria-label="Закрыть">×</button></div>
  <div class="form" id="quickForm"></div>
</div>

<div class="overlay" id="settingsPanel" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <nav class="tabs" id="settingsTabs"></nav>
    <div class="tab-body">
      <div class="panel-head"><h2 id="settingsTitle"></h2><button class="icon" id="settingsClose" aria-label="Закрыть">×</button></div>
      <div class="form" id="settingsForm"></div>
      <p class="hint">Здесь пока только настройки чертежа и принтера; почерк — в <a href="/classic">классическом интерфейсе</a>.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/static/keepalive.js"></script>
<script src="/ui/fields.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
